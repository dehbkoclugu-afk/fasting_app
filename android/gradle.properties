org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
android.useAndroidX=true
# Jetifier rewrote every dependency looking for pre-AndroidX support-library
# classes, which ran the Flutter engine jars through JetifyTransform and blew
# the heap on an 8 GB machine. Every plugin here is AndroidX-native, so the
# rewrite is dead weight.
