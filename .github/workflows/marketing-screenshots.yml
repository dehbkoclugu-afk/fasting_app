name: Capture FastTrack marketing screens

on:
  pull_request:
    paths:
      - "test/marketing_screenshots_test.dart"
      - ".github/workflows/marketing-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.10
          channel: stable
          cache: true

      - name: Prepare Inter test fonts
        run: |
          mkdir -p test/fonts
          curl -L --fail \
            'https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip' \
            -o /tmp/inter.zip
          for weight in Regular Medium SemiBold Bold ExtraBold; do
            unzip -p /tmp/inter.zip "extras/ttf/Inter-${weight}.ttf" \
              > "test/fonts/Inter-${weight}.ttf"
          done
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pubspec.yaml")
          text = path.read_text()
          marker = "    - assets/animations/\n"
          if "    - test/fonts/\n" not in text:
              if marker not in text:
                  raise SystemExit("assets marker not found in pubspec.yaml")
              text = text.replace(marker, marker + "    - test/fonts/\n")
              path.write_text(text)
          PY

      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Render Turkish dark-mode screens
        env:
          CAPTURE_MARKETING_SCREENSHOTS: "1"
        run: flutter test test/marketing_screenshots_test.dart --update-goldens

      - name: Verify generated screens
        run: |
          test "$(find test/goldens -name 'fasttrack-*-dark-tr.png' | wc -l)" -eq 5
          file test/goldens/fasttrack-*-dark-tr.png

      - uses: actions/upload-artifact@v4
        with:
          name: fasttrack-dark-tr-marketing-screens
          path: test/goldens/fasttrack-*-dark-tr.png
          if-no-files-found: error
          retention-days: 14
