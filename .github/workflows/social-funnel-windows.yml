name: FastTrack Social Funnel Windows

on:
  push:
    branches: ['main']
    paths:
      - 'social_funnel/**'
      - '.github/workflows/social-funnel-windows.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'social_funnel/**'
      - '.github/workflows/social-funnel-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Test and package Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Build and test
        shell: pwsh
        run: ./social_funnel/packaging/build.ps1
      - name: Smoke test packaged EXE
        shell: pwsh
        run: ./social_funnel/packaging/smoke-test.ps1
