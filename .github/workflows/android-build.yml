name: Android build

# Compile check for the Android release bundle. The upload keystore lives in
# Codemagic, not here, so the bundle this produces is unsigned and cannot be
# uploaded to Play — it exists to catch a broken build before a release run.

on:
  push:
    branches: ['main']
    paths:
      - 'android/**'
      - 'ios/**'
      - 'third_party/**'
      - '.github/**'
      - 'codemagic.yaml'
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
  pull_request:
    branches: ['main']
    paths:
      - 'android/**'
      - 'ios/**'
      - 'third_party/**'
      - '.github/**'
      - 'codemagic.yaml'
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test, build bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Native photo decoder regression
        run: python3 tool/verify_picker_sampling.py

      # Pinned to the version Codemagic uses: newer stables break google_fonts
      # 6.2.1 and phosphor_flutter 2.1.0.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.38.10
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter gen-l10n

      # Infos are not fatal: the repo carries pre-existing Radio deprecations.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Storage quota may be exhausted even when the release bundle builds.
        continue-on-error: true
        with:
          name: app-release-unsigned-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
