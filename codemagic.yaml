# Codemagic CI/CD — FastTrack iOS build to TestFlight (no Mac needed).
#
# ONE-TIME SETUP in the Codemagic web UI before the first build (iOS ships
# from the Cey Studios Apple Developer account):
#   1. Add this repository as an application in the Cey Studios team.
#   2. Teams > Integrations > App Store Connect: upload the Cey Studios App
#      Store Connect API key (.p8) and name the integration "Codemagic" — that
#      is the name `app_store_connect:` below refers to.
#   3. Create an environment variable group named "fasttrack_release" holding
#      the values listed under the iOS workflow (mark the secrets as secure).
#
# Prerequisites on the Apple side (done once, in App Store Connect):
#   - App record created with bundle id com.ceystudios.fasttrack
#   - Paid Applications Agreement signed, In-App Purchase capability enabled
#   - IAP products: fasttrack_premium_monthly / _yearly / _lifetime
#     attached to the RevenueCat "premium" entitlement.

workflows:
  ios-testflight:
    name: FastTrack iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      # Automatic code signing — Codemagic manages the account's distribution
      # certificate and provisioning profile via the App Store Connect
      # integration. No manual
      # openssl/--create: that leaked a throwaway cert per build and hit Apple's
      # 2-cert limit (409). Codemagic reuses the shared distribution cert.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ceystudios.fasttrack
      # Pinned: `stable` drifted to 3.44.x (Dart 3.12), which breaks two deps:
      # google_fonts 6.2.1 (FontWeight gained `==` override in 3.41 -> const map
      # key error) and phosphor_flutter 2.1.0 (IconData became `final class` in
      # 3.44 -> can't extend). 3.38.10 is the newest stable where both compile.
      # ponytail: version-lock stopgap; drop it once google_fonts is bumped and
      # phosphor_flutter is replaced (2.1.0 is its last release, no IconData fix).
      flutter: 3.38.10
      xcode: latest
      cocoapods: default
      groups:
        - fasttrack_release
      # Values live in the "fasttrack_release" group in the Codemagic UI:
      #   REVENUECAT_IOS_API_KEY, ADMOB_IOS_BANNER_ID,
      #   ADMOB_IOS_INTERSTITIAL_ID, PRIVACY_POLICY_URL,
      #   TERMS_OF_USE_URL, IOS_STORE_URL, GEMINI_API_KEY
    scripts:
      - name: Disable Swift Package Manager
        # google_mobile_ads still uses CocoaPods; SPM (auto-enabled by newer
        # Flutter) conflicts with it via webview_flutter_wkwebview. Force pods.
        script: flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate l10n
        script: flutter gen-l10n
      - name: Set up code signing
        script: xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --dart-define=REVENUECAT_IOS_API_KEY=$REVENUECAT_IOS_API_KEY \
            --dart-define=ADMOB_IOS_BANNER_ID=$ADMOB_IOS_BANNER_ID \
            --dart-define=ADMOB_IOS_INTERSTITIAL_ID=$ADMOB_IOS_INTERSTITIAL_ID \
            --dart-define=PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL \
            --dart-define=TERMS_OF_USE_URL=$TERMS_OF_USE_URL \
            --dart-define=IOS_STORE_URL=$IOS_STORE_URL \
            --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - berkaydumangoz@gmail.com
        notify:
          success: true
          failure: true

  android-playstore:
    name: FastTrack Android → Play Store
    # Same machine as the iOS workflow: linux_x2 needs a paid Codemagic plan,
    # and Android builds the same on macOS.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # Code signing. The keystore lives in the Codemagic UI under Code
      # signing identities > Android keystores; this is its reference name.
      # Play only accepts bundles signed with the upload key it has
      # registered for com.dehbkoclugu.fasttrack (Play Console > App
      # integrity > App signing): the "Regl Takip" key, SHA1
      # DE:7E:1A:6E:46:F9:0B:C7:…. The "fasttrack_upload" keystore is a
      # different key (SHA1 36:ED:82:3B:…) and Play rejects bundles it signs.
      # A name that does not exist fails the build.
      android_signing:
        - regl
      flutter: 3.38.10
      java: 17
      groups:
        - fasttrack_release
    scripts:
      - name: Native photo decoder regression
        script: python3 tool/verify_picker_sampling.py
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate l10n
        script: flutter gen-l10n
      - name: Analyze
        # Infos are not fatal: the repo carries pre-existing Radio deprecations.
        script: flutter analyze --no-fatal-infos
      - name: Test
        script: flutter test
      - name: Set up key.properties
        # android_signing places the keystore on disk and exports these
        # variables; build.gradle.kts reads key.properties, so without this
        # bridge the release signingConfig is null and the bundle comes out
        # unsigned — which is what Play rejected.
        script: |
          set -e
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=${CM_KEY_PASSWORD:-$CM_KEY_ALIAS_PASSWORD}
          keyAlias=${CM_KEY_ALIAS:-$CM_KEY_ALIAS_USERNAME}
          storeFile=$CM_KEYSTORE_PATH
          EOF
          test -s "$CM_KEYSTORE_PATH" || { echo "No keystore: check the android_signing reference name"; exit 1; }
      - name: Build AAB
        # Every one of these except GEMINI_API_KEY also has a fallback in
        # BuildConfig, so an empty variable degrades to the in-source value
        # instead of shipping a build with purchases and ads switched off.
        # GEMINI_API_KEY has no fallback because it is a billable secret.
        # Fail before producing an AAB if Codemagic did not inject it; otherwise
        # the release would expose a food scanner that can only show an error.
        script: |
          set -e
          test -n "${GEMINI_API_KEY:-}" || {
            echo "Missing GEMINI_API_KEY in the fasttrack_release variable group"
            exit 1
          }
          flutter build appbundle --release \
            --dart-define=REVENUECAT_ANDROID_API_KEY=$REVENUECAT_ANDROID_API_KEY \
            --dart-define=ADMOB_ANDROID_BANNER_ID=$ADMOB_ANDROID_BANNER_ID \
            --dart-define=ADMOB_ANDROID_INTERSTITIAL_ID=$ADMOB_ANDROID_INTERSTITIAL_ID \
            --dart-define=PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL \
            --dart-define=TERMS_OF_USE_URL=$TERMS_OF_USE_URL \
            --dart-define=ANDROID_STORE_URL=$ANDROID_STORE_URL \
            --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY
      - name: Build APK
        # Produces an installable release APK for direct distribution. The same
        # release signing configuration and dart-defines as the AAB are used.
        script: |
          flutter build apk --release \
            --dart-define=REVENUECAT_ANDROID_API_KEY=$REVENUECAT_ANDROID_API_KEY \
            --dart-define=ADMOB_ANDROID_BANNER_ID=$ADMOB_ANDROID_BANNER_ID \
            --dart-define=ADMOB_ANDROID_INTERSTITIAL_ID=$ADMOB_ANDROID_INTERSTITIAL_ID \
            --dart-define=PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL \
            --dart-define=TERMS_OF_USE_URL=$TERMS_OF_USE_URL \
            --dart-define=ANDROID_STORE_URL=$ANDROID_STORE_URL \
            --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY
      - name: Verify the bundle is signed
        # Play refuses an unsigned upload, and a successful build is not proof
        # of one: fail here instead of at the store.
        script: |
          set -e
          # Only the bundle under outputs/ is the finished one; Gradle also
          # leaves unsigned intermediates behind.
          AAB=$(find build/app/outputs -name "*.aab" | head -1)
          test -n "$AAB" || { echo "No bundle under build/app/outputs"; exit 1; }
          jarsigner -verify "$AAB" | grep -q "jar verified" || {
            echo "$AAB is NOT signed"; exit 1;
          }
          echo "Signed: $AAB"
          # Print the signer so it can be checked against the upload key
          # certificate in Play Console > App integrity > App signing, which
          # Play quotes as SHA1 when it rejects a bundle.
          keytool -printcert -jarfile "$AAB" | grep -E "Owner:|SHA1:|SHA256:" | head -6
          # Fail here rather than at Play when the bundle carries another key.
          PLAY_UPLOAD_SHA1="DE:7E:1A:6E:46:F9:0B:C7:27:54:D0:52:F8:F4:A5:F7:DA:C9:FD:56"
          keytool -printcert -jarfile "$AAB" | grep -q "SHA1: $PLAY_UPLOAD_SHA1" || {
            echo "Bundle is not signed with Play's upload key ($PLAY_UPLOAD_SHA1)"; exit 1;
          }
          # The signer's public certificate, for a Play upload key reset
          # request. It holds no private key.
          keytool -printcert -rfc -jarfile "$AAB" \
            | sed -n '/BEGIN CERTIFICATE/,/END CERTIFICATE/p' \
            | sed '/END CERTIFICATE/q' > build/upload_certificate.pem
    artifacts:
      - build/upload_certificate.pem
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
    publishing:
      # Uncomment once a Google Play service account JSON is stored in the
      # "fasttrack_release" group as GCLOUD_SERVICE_ACCOUNT_CREDENTIALS. Until
      # then the bundle arrives by email and is uploaded by hand.
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true
      email:
        recipients:
          - dehbkoclugu@gmail.com
        notify:
          success: true
          failure: true

