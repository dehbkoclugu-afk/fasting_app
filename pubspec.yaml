name: fasting_app
description: "Intermittent Fasting Tracker - Track your fasting journey"
publish_to: 'none'
version: 1.2.9+25

environment:
  sdk: ^3.7.0-323.2.beta

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # UI & Animations
  phosphor_flutter: ^2.1.0
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  google_fonts: 6.2.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.7.0
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # In-App Purchases
  purchases_flutter: ^10.19.0

  # Home Widget
  home_widget: ^0.7.0

  # AI food photo analysis
  image_picker: ^1.2.3
  http: ^1.2.2

  # Utils
  intl: '>=0.19.0 <0.21.0'
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  google_mobile_ads: ^6.0.0
  app_tracking_transparency: ^2.0.7
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  image: ^4.8.0

# 0.8.13+17 computes the native decode sample size from unpopulated bounds,
# allocating full-resolution camera bitmaps. Keep this patch until upstream
# ships the regression fix; see third_party/image_picker_android/FASTTRACK_PATCH.md.
dependency_overrides:
  image_picker_android:
    path: third_party/image_picker_android

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFF7EC"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icons/app_icon_monochrome.png"

flutter_native_splash:
  color: "#FFF7EC"
  color_dark: "#0F0F1A"
  image: "assets/icons/splash_logo.png"
  image_dark: "assets/icons/splash_logo_dark.png"
  android_12:
    color: "#FFF7EC"
    color_dark: "#0F0F1A"
    icon_background_color: "#FFF7EC"
    icon_background_color_dark: "#0F0F1A"
    image: "assets/icons/splash_logo.png"
    image_dark: "assets/icons/splash_logo_dark.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/editorial/
    - assets/images/editorial/v2/
    - assets/images/editorial/v3/
    - assets/images/editorial/v4/
    - assets/images/editorial/v4/quick/
    - assets/images/editorial/v5/
    - assets/images/editorial/v6/
    - assets/icons/
    - assets/animations/
