name: fasting_app
description: "Intermittent Fasting Tracker - Track your fasting journey"
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.7.0-323.2.beta

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # UI & Animations
  phosphor_flutter: ^2.1.0
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  google_fonts: ^6.4.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.7.0
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Health
  health: 13.1.3

  # In-App Purchases
  purchases_flutter: ^8.4.1

  # Home Widget
  home_widget: ^0.7.0

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  google_mobile_ads: ^6.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  image: ^4.8.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#6C63FF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter_native_splash:
  color: "#0F0F1A"
  color_dark: "#0F0F1A"
  image: "assets/icons/splash_logo.png"
  android_12:
    color: "#0F0F1A"
    icon_background_color: "#0F0F1A"
    image: "assets/icons/splash_logo.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
